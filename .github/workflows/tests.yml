name: Run tests
on: [push]

jobs:
  run-tests:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.12.3"

      - name: UV sync
        run: uv sync --frozen

      - name: Run pytests
        run: uv run pytest
